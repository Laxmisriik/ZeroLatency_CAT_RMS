version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cat_rms_db
    environment:
      POSTGRES_USER: catadmin
      POSTGRES_PASSWORD: caterpillar2026
      POSTGRES_DB: smart_rental
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata:
